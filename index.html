<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="خودرو ایتالیا">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>خودرو ایتالیا</title>
<!-- Vazirmatn font (v33.0.3, OFL license: fonts/OFL.txt) is inside the app, so it works offline -->
<link rel="preload" href="fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</style>
<script>
  // real phone, installed web app, or the iOS/Android store app (Capacitor) → full-screen app mode
  if (window.Capacitor || matchMedia("(max-width: 700px)").matches || navigator.standalone || matchMedia("(display-mode: standalone)").matches)
    document.documentElement.classList.add("app");
</script>
</head>
<body>

<!-- ============ presentation ============ -->
<div class="stage">
  <div class="side">
    <h1>نمونه‌ی اپ <span>خودرو ایتالیا</span></h1>
    <p class="lead">نسخه‌ی اول با طراحی شبیه اپل. روی گوشی بزن و مثل یه اپ واقعی باهاش کار کن، یا از لیست پایین برو سراغ هر مرحله.</p>
    <div class="steps" id="steps"></div>
    <div class="ctrls">
      <button class="pill" id="prev">→ قبلی</button>
      <button class="pill primary" id="next">بعدی ←</button>
      <button class="pill" id="theme">🌙 حالت تاریک</button>
      <button class="pill" id="gal">▦ همه‌ی صفحه‌ها</button>
    </div>
  </div>
  <div class="phone-wrap"><div class="phone" id="phone"></div></div>
</div>

<div class="gallery" id="gallery">
  <h2>همه‌ی صفحه‌ها</h2>
  <p>همه‌ی صفحه‌ها کنار هم. روی هر کدوم بزنی، توی گوشی باز می‌شه.</p>
  <div class="ggrid" id="ggrid"></div>
</div>

<script src="i18n/i18n.js"></script>
<script src="i18n/it.js"></script>
<script src="i18n/en.js"></script>
<script src="data/bollo-2026.js"></script>
<!-- The app: these files share one scope and must load in this order (see docs/CODE_MAP.md) -->
<script src="js/core.js"></script>
<script src="js/insurance.js"></script>
<script src="js/bollo.js"></script>
<script src="js/state.js"></script>
<script src="js/news.js"></script>
<script src="js/reminders.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
