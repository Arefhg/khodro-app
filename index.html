<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="خودرو ایتالیا">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>خودرو ایتالیا</title>
<!-- Vazirmatn font (v33.0.3, OFL license: fonts/OFL.txt) is inside the app, so it works offline -->
<link rel="preload" href="fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Vazirmatn";src:url("fonts/Vazirmatn-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* =========================================================
   Khodro Italy — sample web app (v1)
   Apple-style (iOS) design: large titles, grouped cards,
   blur bars, sheets, segmented controls, light + dark.
   ========================================================= */
:root{
  --tint:#E5383B; --tint2:#C9184A; --green:#30A46C; --orange:#F59E0B; --blue:#0A84FF; --purple:#8E5CF7;
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --label:#0B0B0F; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.14); --fill:rgba(118,118,128,.12); --bar:rgba(249,249,251,.78);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --page:#E9E6E1;
}
[data-theme=dark]{
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --label:#F5F5F7; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --bar:rgba(22,22,24,.78); --shadow:none; --page:#111113;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Vazirmatn",-apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--page);color:var(--label);
  transition:background .4s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- presentation page ---------- */
.stage{min-height:100vh;display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:center;justify-content:center;
  padding:40px 56px;max-width:1280px;margin:auto}
.side h1{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.side h1 span{background:linear-gradient(90deg,#1F9D55,#9CA3AF 50%,#E5383B);-webkit-background-clip:text;background-clip:text;color:transparent}
.side p.lead{color:var(--label2);margin:10px 0 24px;font-size:15px;line-height:1.8}
.steps{display:flex;flex-direction:column;gap:4px}
.steps button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-align:start;font-size:14.5px;color:var(--label2);transition:.2s}
.steps button b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--fill);color:var(--label2);flex:none}
.steps button.on{background:var(--card);color:var(--label);box-shadow:var(--shadow)}
.steps button.on b{background:var(--tint);color:#fff}
.steps small{display:block;font-size:12px;color:var(--label3)}
.ctrls{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.pill.primary{background:var(--label);color:var(--bg)}
.phone-wrap{display:flex;justify-content:center}

/* ---------- iPhone ---------- */
.phone{width:393px;height:852px;border-radius:62px;padding:12px;background:#1b1b1d;position:relative;
  box-shadow:0 0 0 2px #3a3a3c,0 0 0 9px #0d0d0e,0 40px 80px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25)}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;top:0;inset-inline:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0;
  z-index:55;font-weight:700;font-size:16px;direction:ltr;pointer-events:none}
.status .icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--label);opacity:.85;z-index:70}

/* views & navigation */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:54px 0 110px;background:var(--bg)}
.view::-webkit-scrollbar{display:none}
.view.enter{animation:push .42s cubic-bezier(.2,.8,.2,1)}
.view.fade{animation:fadeIn .35s ease}
@keyframes push{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.navbar{position:sticky;top:0;z-index:20;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:transparent;transition:background .2s}
.navbar.solid{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.navbar .ttl{font-weight:700;font-size:17px;opacity:0;transition:.2s}
.navbar.solid .ttl{opacity:1}
.navbtn{color:var(--tint);font-size:17px;display:flex;align-items:center;gap:2px;min-width:60px}
.navbtn.end{justify-content:flex-end}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--tint)}
.large{font-size:34px;font-weight:800;letter-spacing:-.01em;padding:2px 20px 6px}
.subhead{padding:0 20px 14px;color:var(--label2);font-size:15px}

/* tab bar */
.tabbar{position:absolute;bottom:0;inset-inline:0;height:88px;z-index:40;display:flex;justify-content:space-around;padding:8px 10px 0;
  background:var(--bar);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--sep)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--label3);width:72px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--tint)}

/* cards & lists */
.section{padding:0 16px;margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px 8px}
.sec-h h3{font-size:21px;font-weight:800}
.sec-h a{color:var(--tint);font-size:15px;cursor:pointer;text-decoration:none}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:60px;inset-inline-end:0;height:.5px;background:var(--sep)}
.row .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.row .ic svg{width:18px;height:18px}
.row .t{flex:1;font-size:16px}
.row .v{color:var(--label2);font-size:15px}
.chev{color:var(--label3);width:9px;height:15px;transform:scaleX(-1)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--label2)}
.badge.soon{background:rgba(10,132,255,.12);color:var(--blue)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-size:17px;font-weight:700;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--tint);color:#fff}
.btn.tinted{background:rgba(229,56,59,.12);color:var(--tint)}
.btn.plain{color:var(--tint);height:44px}

/* onboarding */
.ob{position:absolute;inset:0;display:flex;flex-direction:column;padding:70px 28px 44px;background:var(--bg)}
.ob .grow{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ob h2{font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1.3;margin-top:26px}
.ob p{color:var(--label2);font-size:16px;line-height:1.85;margin-top:10px}
.logo{width:116px;height:116px;border-radius:30px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#2b2d33,#0f1012);box-shadow:0 20px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.logo::after{content:"";position:absolute;inset-inline:0;bottom:0;height:9px;background:linear-gradient(90deg,#E5383B 33.3%,#fff 33.3% 66.6%,#1F9D55 66.6%)}
.welcome-bg{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(60% 40% at 20% 10%,rgba(31,157,85,.18),transparent 70%),
  radial-gradient(60% 40% at 85% 25%,rgba(229,56,59,.2),transparent 70%),var(--bg)}
.feature-list{display:flex;flex-direction:column;gap:22px;margin-top:34px;text-align:start;width:100%}
.feat{display:flex;gap:16px;align-items:flex-start}
.feat .fi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.feat .fi svg{width:24px;height:24px}
.feat b{font-size:16px;display:block}
.feat span{font-size:14px;color:var(--label2);line-height:1.7}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:22px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--label3);transition:.3s}
.dots i.on{width:22px;background:var(--tint)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;position:relative}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:600;position:relative;z-index:1;transition:color .2s}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
[data-theme=dark] .seg button.on{background:#636366}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.choice button{background:var(--card);border-radius:20px;padding:20px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;
  font-weight:700;font-size:15px;border:2px solid transparent;box-shadow:var(--shadow);transition:.2s}
.choice button svg{width:64px;height:40px;color:var(--label2)}
.choice button.on{border-color:var(--tint);color:var(--tint)}
.choice button.on svg{color:var(--tint)}
.regions{width:100%;margin-top:18px;text-align:start}
.regions .group{max-height:270px;overflow-y:auto;scrollbar-width:none}
.check{width:22px;height:22px;color:var(--tint);opacity:0}
.row.sel .check{opacity:1}
.notif-demo{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:10px}
.nbanner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;text-align:start;
  background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.1);animation:drop .6s cubic-bezier(.2,.8,.2,1) both}
.nbanner:nth-child(2){animation-delay:.25s;opacity:.85;transform:scale(.97)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.nbanner .ni{width:38px;height:38px;border-radius:10px;flex:none;background:linear-gradient(145deg,#2b2d33,#0f1012);display:grid;place-items:center}
.nbanner b{font-size:14px} .nbanner p{font-size:13px;color:var(--label2);margin:0;line-height:1.6}
.nbanner small{margin-inline-start:auto;color:var(--label3);font-size:12px;align-self:flex-start}

/* home */
.hello{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 14px}
.hello .d{font-size:13px;font-weight:700;color:var(--label2);text-transform:uppercase}
.hello h1{font-size:34px;font-weight:900;letter-spacing:-.01em}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#E5383B,#8E1B2E);color:#fff;display:grid;place-items:center;font-weight:800}
.hero{padding:20px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(140deg,#E5383B 0%,#B5172F 55%,#6D0F24 100%)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);top:-120px;left:-80px}
.hero .k{font-size:13px;font-weight:700;opacity:.85}
.hero h2{font-size:24px;font-weight:900;margin:6px 0 2px;padding-inline-end:96px}
.hero .k, .hero p{padding-inline-end:96px}
.hero p{opacity:.85;font-size:14px}
.hero .ring{position:absolute;inset-inline-end:20px;top:22px;width:84px;height:84px}
.hero .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:900;line-height:1}
.hero .ring small{display:block;font-size:10px;font-weight:600;opacity:.85;margin-top:2px}
.hero .acts{display:flex;gap:8px;margin-top:18px}
.hero .acts button{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:700}
.hero .acts button.w{background:#fff;color:#B5172F}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:start;min-height:132px;position:relative;transition:transform .15s}
.tool:active{transform:scale(.97)}
.tool .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tool .ti svg{width:23px;height:23px}
.tool b{font-size:15.5px}
.tool span{font-size:12.5px;color:var(--label2);line-height:1.6}
.tool .badge{position:absolute;top:14px;inset-inline-end:14px}
.news{display:flex;flex-direction:column}
.news .n{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.news .n+.n{border-top:.5px solid var(--sep)}
.news .src{font-size:12px;color:var(--label2);display:flex;gap:6px;align-items:center}
.news .src i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.news b{display:block;font-size:15px;line-height:1.6;margin:4px 0}
.news .tags{color:var(--blue);font-size:13px}
.news .thumb{width:62px;height:62px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff}
.tip{display:flex;gap:14px;padding:16px;align-items:center;background:linear-gradient(135deg,rgba(31,157,85,.14),rgba(31,157,85,.04));box-shadow:none}
.tip .ti{width:40px;height:40px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;flex:none}
.tip p{font-size:14px;line-height:1.75}

/* garage */
.carcard{overflow:hidden;cursor:pointer;transition:transform .15s}
.carcard:active{transform:scale(.98)}
.carcard .top{height:150px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.carcard .top svg.car{width:250px;height:100px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.25))}
.carcard .meta{padding:14px 16px 16px}
.carcard h4{font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.carcard .sub{color:var(--label2);font-size:13.5px;margin-top:2px}
.plate{direction:ltr;display:inline-flex;align-items:stretch;height:26px;border-radius:5px;overflow:hidden;border:1.5px solid #1b1b1b;background:#fff;color:#111;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;letter-spacing:.06em}
.plate .eu{background:#0b3fa8;color:#fff;width:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:9px;padding-bottom:2px}
.plate .nr{padding:0 8px;display:flex;align-items:center}
.plate .rg{background:#0b3fa8;width:12px}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--fill)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.ok i{background:var(--green)} .chip.warn i{background:var(--orange)} .chip.bad i{background:var(--tint)}
.chip.warn{background:rgba(245,158,11,.13)} .chip.bad{background:rgba(229,56,59,.12)}
.empty-add{border:2px dashed var(--sep);border-radius:22px;padding:22px;text-align:center;color:var(--label2);font-size:14px;background:transparent;width:100%}
.empty-add b{color:var(--tint);display:block;font-size:16px;margin-bottom:2px}

/* car detail */
.detail-hero{height:260px;margin-top:-54px;padding-top:54px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.detail-hero svg.car{width:310px;height:124px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.3));margin-bottom:6px}
.detail-head{text-align:center;padding:14px 20px 18px}
.detail-head h2{font-size:28px;font-weight:900}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spec{padding:12px;text-align:center}
.spec b{display:block;font-size:18px;font-weight:800}
.spec span{font-size:12px;color:var(--label2)}
.deadline{display:flex;align-items:center;gap:14px;padding:14px 16px}
.deadline+.deadline{border-top:.5px solid var(--sep)}
.deadline .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.deadline .ic svg{width:21px;height:21px}
.deadline .tx{flex:1}
.deadline .tx b{font-size:15.5px;display:block}
.deadline .tx span{font-size:13px;color:var(--label2)}
.deadline .left{text-align:center;min-width:58px}
.deadline .left b{font-size:20px;font-weight:900;display:block;line-height:1.1}
.deadline .left span{font-size:11px;color:var(--label2)}
.bar{height:5px;border-radius:3px;background:var(--fill);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:80;opacity:0;pointer-events:none;transition:opacity .35s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;top:58px;z-index:90;background:var(--bg);border-radius:14px 14px 0 0;
  transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px}
.sheet .sh b{font-size:17px}
.sheet .body{overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:.5px;background:var(--sep)}
.field label{width:96px;font-size:16px;flex:none}
.field input,.field select{flex:1;border:0;background:none;outline:0;font-size:16px;color:var(--label);padding:12px 0;min-width:0}
.field input::placeholder{color:var(--label3)}
.field input.ltr{direction:ltr;text-align:start}
.sos{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;position:relative}
.sos + .sos{border-top:.5px solid var(--sep, rgba(127,127,127,.25))}
.sos .num{font-size:22px;font-weight:800;unicode-bidi:plaintext;text-align:start;letter-spacing:.5px}
.sos .d{font-size:14.5px;line-height:1.75;margin-top:4px}
.sos .lang{font-size:13px;color:var(--label2);margin-top:6px;line-height:1.6}
.sos .tx{flex:1;min-width:0}
.sos .call{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#30A46C;margin-top:2px}
.sos .call svg{width:22px;height:22px}
.sos-hero{background:linear-gradient(145deg,#E5383B,#B91C1C);color:#fff;border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center}
.sos-hero b{font-size:40px;font-weight:900;direction:ltr}
.sos-hero p{font-size:14.5px;line-height:1.7;opacity:.95}
.sos-hero a{margin-inline-start:auto;background:#fff;color:#B91C1C;border-radius:999px;padding:10px 16px;font-weight:800;text-decoration:none;white-space:nowrap}
.foot{font-size:12.5px;color:var(--label2);padding:6px 16px 18px;line-height:1.7}
.euro{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}
.euro button{min-width:42px;height:34px;border-radius:10px;background:var(--fill);font-weight:700;font-size:14px}
.euro button.on{background:var(--tint);color:#fff}
.colors{display:flex;gap:12px;padding:12px 16px}

function parseProv(t, tail){ const o = {}, tl = tail.split(" "); t.split(";").forEach((p, i) => { const [n, v] = p.split(":"); const [mean,p25,p50,p75] = v.split(",").map(Number); const [p10,p95] = tl[i].split(",").map(Number);
  // p90 is not published: read it between p75 and p95 on a log scale (normal-curve positions 0.674 → 1.282 → 1.645)
  const p90 = Math.exp(Math.log(p75) + (1.2816-0.6745)/(1.6449-0.6745) * (Math.log(p95) - Math.log(p75)));
  o[n] = { mean,p10,p25,p50,p75,p90,p95 }; }); return o; }
const BM_COEF = [0,1.030,1.106,1.140,1.175,1.211,1.248,1.287,1.327,1.368,1.410,1.454,1.499,1.545,1.720,2.000,3.100,3.500,4.000]; // Allianz, real policy document
/* Years of patente (licence) — IVASS does not publish this split, so we add our own factor.
   Why it depends on age: in IVASS's class 11–18 group, young riders/drivers are mostly real beginners,
   but for 26+ the group is full of experienced people who just start again in class 14 (new vehicle,
   no family class). So a beginner aged 26+ pays far more than that group's average; a beginner aged
   ≤24/25 pays about the group average.
   Calibration:
   - moto 26+: real contract data (rider 30, Caserta, 125cc, RC only): yr1 €1,890, yr2 €1,316/yr → ×2.04, ×1.58
   - car 26+: published beginner prices in class 14 (Facile.it 1,000–1,200; sum.money 1,000–2,000; ticalcolo 1,500–3,000)
     vs IVASS 25–34 group €936 → middle ≈ ×1.4
   - youngest band: ×1 (checked: Bari agency €1,420, Segugio simulation €1,470, IVASS ≤24 group €1,460)
   Year 3 sits between; after 3 years the factor is gone ("neopatentato" = licence under 3 years). */
const LIC = { moto:[2.04, 1.58, 1.25, 1], car:[1.40, 1.25, 1.10, 1] };
const licFactor = (kind, age, lic) => age === 0 ? 1 : (LIC[kind][lic] ?? 1);

function insEstimate(kind, prov, ageIdx, cu, lic = 3){
  const g = cu === 1 ? 0 : cu <= 3 ? 1 : cu <= 10 ? 2 : 3;
  const ref = [1, 2.5, 7, 14][g];
  const refCoef = g === 1 ? (BM_COEF[2] + BM_COEF[3]) / 2 : BM_COEF[ref];
  const adj = g === 0 ? 1 : BM_COEF[cu] / refCoef;
  const nat = IPER.nat[kind], P = IPER.prov[kind][prov] || { mean:nat, p10:nat*.5, p25:nat*.68, p50:nat*.9, p75:nat*1.18, p90:nat*1.6 };
  const pIdx = P.mean / IPER.nat[kind];
  const base = IPER.ageBM[kind][Math.min(ageIdx, IPER.ageBM[kind].length-1)][g];
  const lf = licFactor(kind, ageIdx, lic);
  const est = base * pIdx * adj * lf;
  // same shape as the province's real price spread, moved to this profile's level
  const k = est / P.mean;
  return { est, typ: P.p50 * k, low: P.p25 * k, high: P.p75 * k, lo80: P.p10 * k, hi80: P.p90 * k, base, pIdx, adj, lf, provMean:P.mean, g };
}

function quoteCalc(q){
  const age = q.kind==="car" ? (q.age<25?0:q.age<35?1:q.age<45?2:q.age<60?3:4) : (q.age<26?0:q.age<40?1:q.age<50?2:q.age<60?3:q.age<70?4:5);
  const lic = Math.min(3, Math.max(0, q.licYears));
  const core = insEstimate(q.kind, q.prov, age, q.cu, lic);
  const f = [
    [tr("استان، سن، کلاس") + (core.lf!==1?tr(" و پاتنته‌ی تازه"):""), core.est, "o", true],
    [QF.claims.label + ": " + QF.claims.opts[q.claims][0], QF.claims.opts[q.claims][1], QF.claims.opts[q.claims][2]],
    [tr("قدرت: ") + QF.power[q.kind][q.power][0], QF.power[q.kind][q.power][1], "e"],
    [tr("کیلومتر سالانه: ") + QF.km[q.km][0], QF.km[q.km][1], "e"],
    [tr("شب کجا پارکه: ") + QF.park[q.park][0], QF.park[q.park][1], "e"],
    [tr("استفاده: ") + QF.use[q.use][0], QF.use[q.use][1], "e"],
    [tr("کی می‌رونه: ") + QF.guide[q.guide][0], QF.guide[q.guide][1], "e"],
    [tr("جعبه سیاه: ") + QF.box[q.box][0], QF.box[q.box][1], "e"],
    [tr("سقف پوشش: ") + QF.limit[q.limit][0], QF.limit[q.limit][1], "e"],
    [tr("پرداخت: ") + QF.pay[q.pay][0], QF.pay[q.pay][1], "o"],
  ];
  const mult = f.slice(1).reduce((a, x) => a * x[1], 1), total = core.est * mult, k = total / core.est;
  // more answers known → narrower spread than the whole province (×0.75 on the log scale; to be checked with contracts)
  const sh = (p) => total * Math.pow(p / core.est, 0.75);
  const taxes = 0.105 + 0.16, net = total / (1 + taxes);
  return { total, f, lo80: sh(core.lo80), hi80: sh(core.hi80), typ: sh(core.typ),
    net, ssn: net*0.105, ipt: net*0.16, commission: total*0.166, claims: net*0.668, monthly: q.pay ? total/12 : 0 };
}

function calcBollo(kind, kw, euro, region){
  kw = Math.max(1, Math.floor(kw));            // official rule: use kW without decimals
  const R = BOLLO.regions[region] || BOLLO.regions["لمباردیا"];
  const lines = []; let total = 0;
  if (kind === "moto") {
    const e = Math.min(euro, 3), [base, per] = R.moto[e];
    if (kw <= 11) { total = (e === 3 && R.motoMin3) ? R.motoMin3 : base; lines.push([`${tr("تا")} ${FA(11)} ${tr("کیلووات (مبلغ ثابت)")}`, total]); }
    else { total = base + per * kw; lines.push([tr("مبلغ ثابت"), base], [`${FA(kw)} ${tr("کیلووات ×")} ${EUR(per)} ${tr("یورو")}`, per * kw]); }
  } else if (R.piemonte) {
    const P = BOLLO.piemonte, e = Math.min(euro, 4);
    if (kw <= 53) { total = kw * P.upTo53[e]; lines.push([`${FA(kw)} ${tr("کیلووات ×")} ${EUR(P.upTo53[e])} ${tr("یورو")}`, total]); }
    else if (kw <= 100) { total = kw * P.upTo100[e]; lines.push([`${FA(kw)} ${tr("کیلووات ×")} ${EUR(P.upTo100[e])} ${tr("یورو")}`, total]); }
    else { const [u, o] = (kw <= 130 ? P.upTo130 : P.over130)[e];
      lines.push([`${FA(100)} ${tr("کیلووات ×")} ${EUR(u)} ${tr("یورو")}`, 100 * u], [`${FA(kw - 100)} ${tr("کیلووات بالای ۱۰۰ ×")} ${EUR(o)} ${tr("یورو")}`, (kw - 100) * o]);
      total = 100 * u + (kw - 100) * o; }
  } else {
    const [u, o] = R.car[euro];
    lines.push([`${FA(Math.min(kw, 100))} ${tr("کیلووات ×")} ${EUR(u)} ${tr("یورو")}`, Math.min(kw, 100) * u]);
    if (kw > 100) lines.push([`${FA(kw - 100)} ${tr("کیلووات بالای ۱۰۰ ×")} ${EUR(o)} ${tr("یورو")}`, (kw - 100) * o]);
    total = Math.min(kw, 100) * u + Math.max(0, kw - 100) * o;
  }
  if (kind === "car" && kw > BOLLO.superbollo.overKw) {
    const x = (kw - BOLLO.superbollo.overKw) * BOLLO.superbollo.perKw;
    lines.push([`${tr("سوپربولو (کشوری):")} ${FA(kw - BOLLO.superbollo.overKw)} ${tr("کیلووات ×")} ${FA(BOLLO.superbollo.perKw)} ${tr("یورو")}`, x]); total += x;
  }
  total = Math.round(total * 100) / 100;
  return { total, lines, ok: R.ok, note: R.note || "", src: R.src };
}

/* =========================================================
   Reminders (only in the iOS/Android store apps)
   The phone schedules them itself, no server. The web app can't do this.
   ========================================================= */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const LN = () => (NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null;
const REMIND_BEFORE = [14, 3, 0];   // days before the deadline
const REMIND_HOUR = 9;              // 9:00 in the morning
function reminderList(){
  const now = new Date(), list = [];
  for (const c of state.cars) for (const [k, d] of Object.entries(c.dl)) REMIND_BEFORE.forEach((before, i) => {
    const at = new Date(d); at.setDate(at.getDate() - before); at.setHours(REMIND_HOUR, 0, 0, 0);
    if (at <= now) return;
    const what = `${DL[k][0]} ${c.name}`;
    list.push({
      id: (c.id % 1000000) * 100 + Object.keys(DL).indexOf(k) * 10 + i,   // must be a 32-bit number (Android)
      title: before === 0 ? `${tr("امروز آخرین مهلت")} ${what}` : `${what}: ${FA(before)} ${tr("روز مونده")}`,
      body: `${tr("تاریخ:")} ${fmtDate(d)}`,
      schedule: { at },
    });
  });
  return list.sort((a, b) => a.schedule.at - b.schedule.at).slice(0, 60);
}
let remindTimer = null;
function syncReminders(){
  clearTimeout(remindTimer);
  remindTimer = setTimeout(async () => {
    const ln = LN(); if (!ln) return;
    try {
      const pending = await ln.getPending();
      if (pending.notifications.length) await ln.cancel({ notifications: pending.notifications.map(n => ({ id: n.id })) });
      if (!state.notify) return;
      const list = reminderList(); if (!list.length) return;
      let perm = await ln.checkPermissions();
      if (perm.display !== "granted") perm = await ln.requestPermissions();
      if (perm.display !== "granted") return;
      await ln.schedule({ notifications: list });
    } catch (e) { console.warn("reminders:", e); }
  }, 400);
}

const phone = document.getElementById("phone");
function screenHTML(id, anim){
  const body = VIEWS[id]();
  const isOb = ["welcome","features","setup","notify"].includes(id);
  return `<div class="screen">${statusBar()}
    ${isOb ? `<div class="view ${anim||''}" style="padding:0">${body}</div>` : `<div class="view ${anim||''}">${body}</div>`}
    <div class="dim ${id==='add'?'on':''}" data-sheet="0"></div>
    <div class="sheet ${id==='add'?'on':''}">${sheetHTML()}</div>
    <div class="toast" id="toast">${I.ok}<span></span></div>
    <div class="home-ind"></div></div>`;
}

let current = "welcome";
function go(id, anim = "fade"){
  current = id;
  state.step = STEPS.findIndex(s => s.id === id);
  if (id === "detail" && !state.cars.some(c => c.id === state.detail)) { if (!state.cars.length) id = current = "garage"; else state.detail = state.cars[0].id; }
  phone.innerHTML = screenHTML(id, anim);
  pinTabbar(phone);
  const view = phone.querySelector(".view");
  const nav = phone.querySelector(".navbar");
  if (nav && view) view.addEventListener("scroll", () => nav.classList.toggle("solid", view.scrollTop > 30));
  if (id === "detail" && nav) nav.classList.add("solid");
  renderSteps();
}

// the tab bar is written inside the scrolling view; move it to the screen so it stays at the bottom
function pinTabbar(root){ root.querySelectorAll(".screen").forEach(sc => { const t = sc.querySelector(".view .tabbar"); if (t) sc.appendChild(t); }); }
function toast(msg){
  const t = phone.querySelector("#toast"); if (!t) return;
  t.querySelector("span").textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200);
}

function renderSteps(){
  document.getElementById("steps").innerHTML = STEPS.map((s,i) =>
    `<button class="${i===state.step?'on':''}" data-step="${s.id}"><b>${FA(i+1)}</b><span>${s.t}<small>${s.s}</small></span></button>`).join("");
}

/* =========================================================
   Events (one listener for the whole page)
   ========================================================= */
document.addEventListener("click", (e) => {
  if (e.target.closest("a[href]")) return;
  const el = e.target.closest("button,[data-open],[data-tab],[data-go],[data-sheet],a,.dim"); if (!el) return;
  const d = el.dataset;
  if (d.step) return go(d.step);
  if (d.go) { if (d.notify !== undefined) { state.notify = d.notify === "1"; if (state.notify && LN()) LN().requestPermissions().catch(() => {}); } return go(d.go, d.go === "home" ? "fade" : "fade"); }
  if (d.tab) { state.detail = null; return go(d.tab); }
  if (d.open) { state.detail = Number(d.open); return go("detail", "enter"); }
  if (d.back) return go(d.back, "fade");
  if (d.veh) { state.vehicle = d.veh; const y = phone.querySelector(".view").scrollTop; go("setup", ""); return; }
  if (d.lang) { I18N.setLang(d.lang); return; }
  if (d.region) { state.region = d.region; phone.querySelectorAll("[data-region]").forEach(b => b.classList.toggle("sel", b === el)); return; }
  if (d.toast) return toast(d.toast);
  if (d.tool) {
    if (d.tool === "bollo" && d.car) { const v = state.cars.find(c => c.id === Number(d.car)); if (v) Object.assign(state.bollo, { kind:v.kind, kw:v.kw, euro:v.euro, region:state.region }); }
    else if (d.tool === "bollo") state.bollo.region = state.region;
    return go(d.tool, "enter");
  }
  if (d.bkind) { state.bollo.kind = d.bkind; state.bollo.kw = d.bkind === "moto" ? 11 : 70; return go("bollo", ""); }
  if (d.beuro) { state.bollo.euro = Number(d.beuro); phone.querySelectorAll("[data-beuro]").forEach(x => x.classList.toggle("on", x === el)); return updBollo(); }
  if (d.kw) { setKw(state.bollo.kw + Number(d.kw)); return; }
  if (d.kwset) { setKw(Number(d.kwset)); return; }
  if (d.qkind) { state.insq.kind = d.qkind; state.insq.age = Math.min(state.insq.age, IPER.ages[d.qkind].length-1); if (!IPER.prov[d.qkind][state.insq.prov]) state.insq.prov = "Caserta"; return rerender(); }
  if (d.qage) { state.insq.age = Number(d.qage); phone.querySelectorAll("[data-qage]").forEach(x => x.classList.toggle("on", x === el)); return updQuote(); }
  if (d.qset) { const [k,v] = d.qset.split("|"); state.quote[k] = Number(v); el.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === el)); return; }
  if (d.qkind2) { state.quote.kind = d.qkind2; state.quote.power = 0; if (!IPER.prov[d.qkind2][state.quote.prov]) state.quote.prov = "Caserta"; return rerender(); }
  if (d.qcu2) { state.quote.cu = Math.min(18, Math.max(1, state.quote.cu + Number(d.qcu2))); return rerender(); }
  if (d.qnav) { const q = state.quote; q.step = Math.min(5, Math.max(0, q.step + Number(d.qnav)));
    if (q.step >= 2 && (!q.age || q.age < 14 || q.age > 99)) { q.step = 1; go("quote",""); return toast(tr("سنت رو درست بنویس")); }
    go("quote",""); phone.querySelector(".view").scrollTop = 0; return; }
  if (d.qpay) { state.insq.monthly = d.qpay === "1"; phone.querySelectorAll("[data-qpay]").forEach(x => x.classList.toggle("on", x === el)); return updQuote(); }
  if (d.qlic) { state.insq.lic = Number(d.qlic); phone.querySelectorAll("[data-qlic]").forEach(x => x.classList.toggle("on", x === el)); return updQuote(); }
  if (d.radd) { state.rf = { paid:"", note:"" }; return updReal(); }
  if (d.rcancel) { state.rf = null; return updReal(); }
  if (d.rsave) {
    const num = (v) => Number(String(v).replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/[^\d.]/g, ""));
    const paid = num(phone.querySelector("#rpaid").value);
    if (!paid || paid < 30 || paid > 10000) { phone.querySelector("#rpaid").focus(); return toast(tr("یه عدد درست بنویس (یورو در سال)")); }
    state.real.push({ ...state.insq, paid, note: phone.querySelector("#rnote").value.trim().slice(0,80) });
    saveReal(); state.rf = null; updReal(); return toast(tr("ثبت شد، مرسی ✓"));
  }
  if (d.qcu) { state.insq.cu = Math.min(18, Math.max(1, state.insq.cu + Number(d.qcu))); return updQuote(); }
  if (d.cls) { state.ins.start = Math.min(18, Math.max(1, state.ins.start + Number(d.cls))); return rerender(); }
  if (d.yr) { state.ins.years[Number(d.yr)] = d.acc === "1"; return rerender(); }
  if (d.cov) { if (d.cov === "rc") return toast(tr("بیمه‌ی شخص ثالث اجباریه، نمی‌شه خاموشش کرد"));
    state.ins.cov[d.cov] = !state.ins.cov[d.cov];
    if (d.cov === "kaskoFull" && state.ins.cov.kaskoFull) state.ins.cov.kaskoPart = false;
    if (d.cov === "kaskoPart" && state.ins.cov.kaskoPart) state.ins.cov.kaskoFull = false;
    return rerender(); }
  if (d.sheet !== undefined) {
    if (d.sheet === "1") { state.editId = null; state.newCar = { kind:"car", name:"", year:"", plate:"", kw:"", euro:6, color:"#1F2937", bollo:"", insurance:"", revisione:"" }; refreshSheet(); phone.querySelector(".sheet").classList.add("on"); phone.querySelector(".dim").classList.add("on"); state.step = 6; renderSteps(); }
    else { phone.querySelector(".sheet").classList.remove("on"); phone.querySelector(".dim").classList.remove("on"); state.step = STEPS.findIndex(s => s.id === "garage"); renderSteps(); }
    return;
  }
  if (d.edit) {
    const v = state.cars.find(c => c.id === Number(d.edit)); if (!v) return;
    state.editId = v.id;
    state.newCar = { kind:v.kind, name:v.name, year:v.year||"", plate:v.plate||"", kw:v.kw, euro:v.euro, color:v.color,
      bollo:isoDay(v.dl.bollo), insurance:isoDay(v.dl.insurance), revisione:isoDay(v.dl.revisione) };
    refreshSheet(); phone.querySelector(".sheet").classList.add("on"); phone.querySelector(".dim").classList.add("on"); return;
  }
  if (d.del) {
    if (!confirm(tr("این وسیله و همه‌ی تاریخ‌هاش پاک بشه؟"))) return;
    state.cars = state.cars.filter(c => c.id !== Number(d.del)); state.editId = null; persist();
    go("garage"); setTimeout(() => toast(tr("پاک شد")), 120); return;
  }
  if (d.kind) { state.newCar.kind = d.kind; return refreshSheet(); }
  if (d.euro) { state.newCar.euro = Number(d.euro); return refreshSheet(); }
  if (d.color) { state.newCar.color = d.color; return refreshSheet(); }
  if (d.save) {
    const n = state.newCar;
    const num = (v) => Number(String(v).replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/[^\d.]/g, ""));
    const shake = (f) => { const i = phone.querySelector(`[data-f=${f}]`); i.focus(); i.closest(".field").animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:300}); };
    if (!n.name.trim()) return shake("name");
    const kw = num(n.kw); if (!kw || kw < 1 || kw > 1000) return shake("kw");
    const dl = {}; for (const k of ["bollo","insurance","revisione"]) { const d = toDate(n[k]); if (d) dl[k] = d; }
    const car = { kind:n.kind, name:n.name.trim(), year:num(n.year)||"", plate:(n.plate||"").trim().toUpperCase(), fuel:"", kw, euro:n.euro, color:n.color, dl };
    if (state.editId) {
      const i = state.cars.findIndex(c => c.id === state.editId);
      if (i >= 0) state.cars[i] = { ...state.cars[i], ...car };
      state.detail = state.editId; state.editId = null; persist();
      go("detail"); setTimeout(() => toast(tr("ذخیره شد ✓")), 120); return;
    }
    state.cars.push({ id:Date.now(), ...car }); persist();
    go("garage"); setTimeout(() => toast(tr("اضافه شد به گاراژ ✓")), 120); return;
  }
  if (d.sw === "notify") { state.notify = !state.notify; el.classList.toggle("on", state.notify); persist(); return; }
  if (d.sw === "dark") { setTheme(document.documentElement.dataset.theme !== "dark"); el.classList.toggle("on"); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.f) state.newCar[e.target.dataset.f] = e.target.value;
  if (e.target.id === "kwr") setKw(Number(e.target.value));
  if (e.target.id === "valr") { state.ins.value = Number(e.target.value); phone.querySelector("#valv").textContent = EUR0(state.ins.value) + " €"; phone.querySelector("#advice").innerHTML = insAdvice(); }
});
document.addEventListener("change", (e) => { if (e.target.id === "breg") { state.bollo.region = e.target.value; updBollo(); }
  if (e.target.id === "qprov") { state.insq.prov = e.target.value; updQuote(); }
  if (e.target.id === "qprov2") state.quote.prov = e.target.value; });
document.addEventListener("input", (e) => { const k = e.target.dataset.qf; if (!k) return;
  const v = e.target.value, n = Number(String(v).replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)));
  state.quote[k] = ["year","age","licYears"].includes(k) ? (isNaN(n) ? 0 : n) : v; });
document.addEventListener("input", (e) => { if (state.rf && e.target.id === "rpaid") state.rf.paid = e.target.value; if (state.rf && e.target.id === "rnote") state.rf.note = e.target.value; });
function setKw(v){
  const max = state.bollo.kind === "moto" ? 120 : 400;
  state.bollo.kw = Math.min(max, Math.max(1, Math.round(v)));
  const q = (s) => phone.querySelector(s);
  if (q("#kwv")) { q("#kwv").textContent = FA(state.bollo.kw); q("#cvv").textContent = `≈ ${FA(Math.round(state.bollo.kw/0.736))} ${tr("اسب")}`; q("#kwr").value = state.bollo.kw; }
  updBollo();
}
function updBollo(){ const r = phone.querySelector("#bres"); if (r) r.innerHTML = bolloResult(); }
function rerender(){ const v = phone.querySelector(".view"), y = v ? v.scrollTop : 0; go(current, ""); const n = phone.querySelector(".view"); if (n) n.scrollTop = y; }
function refreshSheet(){ const s = phone.querySelector(".sheet"); if (s) s.innerHTML = sheetHTML(); }

function setTheme(dark){
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.getElementById("theme").textContent = dark ? tr("☀️ حالت روشن") : tr("🌙 حالت تاریک");
}
document.getElementById("theme").onclick = () => { setTheme(document.documentElement.dataset.theme !== "dark"); if (current === "profile") go("profile", ""); };
document.getElementById("next").onclick = () => go(STEPS[Math.min(STEPS.length-1, state.step+1)].id);
document.getElementById("prev").onclick = () => go(STEPS[Math.max(0, state.step-1)].id);
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input")) return;
  if (e.key === "ArrowLeft") document.getElementById("next").click();
  if (e.key === "ArrowRight") document.getElementById("prev").click();
});

/* gallery: every step side by side */
document.getElementById("gal").onclick = () => {
  const g = document.getElementById("ggrid");
  const keep = current;
  g.innerHTML = STEPS.map((s,i) => { if (s.id === "detail") state.detail = state.cars[0].id;
    return `<div class="gitem" data-step-g="${s.id}"><div class="mini"><div class="phone">${screenHTML(s.id, "")}</div></div><span><b>${FA(i+1)}</b>${s.t}</span></div>`; }).join("");
  pinTabbar(g);
  document.body.classList.add("show-gallery"); window.scrollTo(0,0);
  go(keep, "");
};
document.getElementById("ggrid").addEventListener("click", (e) => {
  const it = e.target.closest("[data-step-g]"); if (!it) return;
  e.stopPropagation(); document.body.classList.remove("show-gallery"); go(it.dataset.stepG);
}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.body.classList.remove("show-gallery"); });

if (matchMedia("(prefers-color-scheme: dark)").matches) setTheme(true);
const IS_APP = document.documentElement.classList.contains("app");
function persist(){ syncReminders(); try { localStorage.setItem("ki_state", JSON.stringify({ seen:true, region:state.region, vehicle:state.vehicle, notify:state.notify,
  cars:state.cars.map(c => ({ ...c, dl:Object.fromEntries(Object.entries(c.dl).map(([k,d]) => [k, d.toISOString()])) })) })); } catch {} }
function restore(){ try { const x = JSON.parse(localStorage.getItem("ki_state") || "null"); if (!x) return false;
  if (x.region === "ترنتینو-آلتوآدیجه") x.region = "ترنتو";
  Object.assign(state, { region:x.region || state.region, vehicle:x.vehicle || state.vehicle, notify:x.notify ?? state.notify });
  if (Array.isArray(x.cars)) state.cars = x.cars.filter(c => c.id > 1000).map(c => ({ ...c, dl:Object.fromEntries(Object.entries(c.dl).map(([k,d]) => [k, new Date(d)])) }));
  return !!x.seen; } catch { return false; } }
const seen = IS_APP && restore();
document.addEventListener("click", () => setTimeout(persist, 50), true);
document.addEventListener("change", () => setTimeout(persist, 50), true);
if (IS_APP && !window.Capacitor && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.title = tr("خودرو ایتالیا");
go(seen ? "home" : "welcome");
syncReminders();
</script>
</body>
</html>
