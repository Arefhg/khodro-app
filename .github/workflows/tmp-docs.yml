name: tmp docs (research, not for merge)
on: push
permissions: {contents: write}
jobs:
  get:
    if: "!contains(github.event.head_commit.message, 'docs added')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null
          mkdir -p tmp_docs && cd tmp_docs
          ua="Mozilla/5.0"
          curl -sfL -A "$ua" -o puglia_nta.pdf "https://pugliacon.regione.puglia.it/documents/455951/545209/A09_DEL_2026_00038_Allegato+A_Parte+II_signed.pdf/4621bb1a-8acc-38f4-56af-d90511ae99c5" || echo fail1
          curl -sfL -A "$ua" -o puglia_dgr1410.pdf "https://burp.regione.puglia.it/documents/20135/2851133/DEL_1410_2026.pdf/d03c7541-ea71-de7a-81ef-59faad5bb37f" || echo fail2
          curl -sfL -A "$ua" -o venezia_map.pdf "https://www.comune.venezia.it/sites/comune.venezia.it/files/page/files/Area%20limitazioni%20e%20percorsi.pdf" || echo fail3
          curl -sfL -A "$ua" -o firenze_8397.pdf "https://ambiente.comune.fi.it/sites/ambiente.comune.fi.it/files/2024-12/2024-M-8397_compressed-1.pdf" || echo fail4
          for f in *.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || true; pdfinfo "$f" | grep -E "Pages|Page size" > "${f%.pdf}.info" || true; done
          pdftoppm -r 110 -png venezia_map.pdf venezia_map || true
          pdftoppm -r 60 -png firenze_8397.pdf firenze_p || true
          ls -la
          cd .. && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp_docs && git commit -qm "docs added" && git push
