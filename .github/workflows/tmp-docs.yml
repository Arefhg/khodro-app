name: tmp docs (research, not for merge)
on: push
permissions: {contents: write}
jobs:
  get:
    if: "!contains(github.event.head_commit.message, 'docs added')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null
          mkdir -p tmp_docs && cd tmp_docs
          B=https://accessoconcertificato.comune.fi.it/trasparenza-atti-allegati/385633
          curl -sfL -m 120 -o all1.pdf "$B/All_1%20-%20Tabella%20divieti%20ZTL-SV.pdf" || echo fail1
          curl -sfL -m 120 -o all2.pdf "$B/All_2%20-%20Disciplinare%20ZTL%20Scudo%20Verde.pdf" || echo fail2
          for f in *.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || true; pdfinfo "$f" > "${f%.pdf}.info" || true; done
          pdftoppm -r 70 -jpeg all1.pdf all1 || true
          rm -f *.pdf; ls -la
          cd .. && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmp_docs && git commit -qm "docs added" && git push
